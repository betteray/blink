name: Build Blink IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

    - name: Clean DerivedData
      run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

    - name: Fetch frameworks
      run: ./get_frameworks.sh

    - name: Fetch resources
      run: ./get_resources.sh

    - name: Copy xcconfig template and disable signing
      run: |
        cp template_setup.xcconfig developer_setup.xcconfig
        echo "CODE_SIGN_IDENTITY=" >> developer_setup.xcconfig
        echo "CODE_SIGNING_REQUIRED=NO" >> developer_setup.xcconfig
        echo "CODE_SIGNING_ALLOWED=NO" >> developer_setup.xcconfig
        echo "PRODUCT_BUNDLE_IDENTIFIER=com.yourname.blink" >> developer_setup.xcconfig

    - name: Clean build folder
      run: xcodebuild clean -project Blink.xcodeproj -scheme Blink -configuration Release

    - name: Build archive unsigned
      run: |
        xcodebuild archive \
          -project Blink.xcodeproj \
          -scheme Blink \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/Blink.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          IPHONEOS_DEPLOYMENT_TARGET='16.1' \
          -xcconfig developer_setup.xcconfig

    - name: Package unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Blink.xcarchive/Products/Applications/Blink.app Payload/
        zip -r Blink.ipa Payload
        mkdir -p output
        mv Blink.ipa output/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blink-unsigned.ipa
        path: output/Blink.ipa